name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the cache-version bump check diffs against the PR base ref,
          # which a depth-1 checkout does not contain.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          # 22, not 20: the test runner only expands glob patterns in --test from Node 22.
          # On 20 it treats "src/**/*.test.ts" as a literal path and finds nothing.
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # The dashboard has no build step and no typechecking, so a syntax error there ships
      # silently and blanks the page at runtime. This is the only automated guard it has.
      - name: Syntax-check dashboard JS
        run: find dashboard -name '*.js' -print0 | xargs -0 -n1 node --check

      # The dashboard's `?v=` refs and ASSET_VERSION are its only cache-busting mechanism,
      # and nothing else can catch them drifting apart: there is no build step, and the files
      # are individually valid either way. Replayed against c158b7d — the merge that actually
      # blanked /dashboard#/posts in production — this step fails.
      - name: Check dashboard cache version
        env:
          BASE_REF: ${{ github.base_ref && format('origin/{0}', github.base_ref) || '' }}
        run: npm run check:assets
      # An icon whose meaning depends on reading direction points the wrong way in RTL
      # unless it is mirrored, and one whose meaning does not becomes wrong IF mirrored.
      # Neither shows up as an error - it renders fine and just reads backwards, in the
      # language this product is actually used in.
      - name: Check RTL icon mirroring
        run: npm run check:icons

      # dashboard/js/icons.js is generated: the Lucide icons the dashboard uses, instead of the
      # 93KB-gzipped UMD from the CDN. An icon added without a rebuild still renders (icons.js
      # falls back to the full UMD), which is exactly why nothing else would notice the 93KB
      # coming back. This fails when the file is not what scripts/build-icons.mjs writes.
      - name: Check icon subset
        run: npm run check:icon-subset

      # The landing's 3D scenes are committed, content-hashed bundles under public/brand/: the hero (hero3d.<sha8>.js), the
      # three diagram scenes (monteur|studio|pmap.<sha8>.js) and the chunk they share, built from scripts/hero3d/ + three.
      # There is no build step on Vercel, so nothing else notices a scene edit that was never rebuilt, a page naming a stale
      # file, a third release, an orphan chunk, the hero growing past 145 KB gzipped or a scene past 20 KB on top of it.
      - name: Check hero 3D bundle
        run: npm run check:hero3d

      # The display face is one committed woff2 under public/brand/, named for the hash of its own bytes and served `immutable`,
      # subset from a pinned google/fonts commit by scripts/build-font.mjs (the only step that needs fontTools; this one needs
      # only node). Nothing else notices a font edited without a rebuild, a page naming a stale file, one of the seven copies of the
      # @font-face block drifting, a second page preloading it, the font growing past 48 KB, or a heading using a glyph it lacks.
      - name: Check display font
        run: npm run check:font

      # The share cards (one 1200x630 PNG per language under public/brand/, named for the hash of its own bytes) are rendered by headless
      # Chrome from the composition in scripts/build-og.mjs; this step needs only node. Nothing else notices a card that was never
      # re-rendered after the composition changed, a page naming a stale one (og:image and twitter:image in both languages on five
      # pages), a card over 300 KB or not 1200x630, a colour that is no longer the token it claims to be, or a character the font lacks.
      - name: Check share cards
        run: npm run check:og

      # The Kufi «رد» icon set (the favicon .svg and .ico, the apple-touch icon, the manifest's PNGs and the content-hashed mark under
      # public/brand/) is rendered from the kit's finals pinned in scripts/brand-icons/ by scripts/build-brand-icons.mjs, which is its own
      # rasteriser (exact polygon coverage), so this step needs only node and compares PIXELS with the committed files. Nothing else
      # notices an icon that was never re-rendered, a manifest naming a stale file, a page missing one of the four head links, a dot
      # added to the ر (it would read «زد»), the .ico past 15 KB, tokens.css painting a colourway the files are not, or a root route
      # removed from src/index.ts (public/** has no static handler: the files 404 without it).
      - name: Check brand icons
        run: npm run check:brand-icons

      # Token colours are one hex edit away from failing AA, and nothing else in this repo
      # would notice. The tightest real pair currently sits at ~4.71:1 - almost no headroom.
      - name: Check colour contrast
        run: npm run check:contrast

      # t() falls back active -> English -> the key itself, which makes a missing Arabic
      # string render English inside an RTL page with nothing logged. Arabic is the primary
      # language here, so en-without-ar is the failure, not the reverse.
      - name: Check translations
        run: npm run check:i18n

      # IDENTITY.md section 7 lists the words this product never says: "Pro" outside the name, instant, guaranteed, AI-powered, bot,
      # revolutionary, all-in-one, magic, viral, supercharge, unlimited and their Arabic (فوراً، مضمون، ذكي، بوت ...). A document is read
      # once; a hype word added to a page, a dictionary value or the dashboard's title nine months later is not caught by anything else.
      # The name is allowed, a limit stated ("not guaranteed") is allowed, and every other exception is a reasoned entry that fails when stale.
      - name: Check voice
        run: npm run check:voice
