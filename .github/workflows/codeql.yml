name: CodeQL

# Static security analysis of the TypeScript and the dashboard's JavaScript. Free for public repositories.
# Weekly and on pushes to main, not on every pull request, to keep PR CI fast. Results appear under
# Security -> Code scanning.

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
