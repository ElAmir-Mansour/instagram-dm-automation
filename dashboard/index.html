<!DOCTYPE html>
<!-- lang/dir are the Arabic defaults and are re-applied by I18N.init() before
     first paint, so the shell is RTL from the very first frame rather than
     flipping after the scripts run. -->
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أوتوريبلاي برو — لوحة تحكم أتمتة الرسائل</title>
    <meta name="description" content="لوحة تحكم أتمتة التعليقات والرسائل على إنستجرام وفيسبوك: الحملات، الجدولة، صندوق الرسائل والتحليلات.">
    <meta name="color-scheme" content="dark light">

    <!-- IBM Plex Sans Arabic is the PRIMARY UI face, not a fallback for Arabic inside
         an English shell: the interface itself is Arabic now. Inter is kept for
         Latin runs (IDs, tokens, URLs), set in its sibling IBM Plex Sans —
         trimmed to the two weights that actually surface, since the Arabic member covers
         Latin glyphs and Inter is reached only as a fallback. -->
    <!-- Icons come from here and are now deferred, so warm the connection
         during head parsing instead of paying DNS+TLS when they are needed. -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>

    <!-- Design tokens first: styles.css only composes them, and eid.html loads
         the same file so there is one design system in this repo, not two. -->
    <!-- No webfont. HIG's answer to typography is the system font, and --font-ui in
         tokens.css is the -apple-system stack, so there is nothing to download: one fewer
         third-party round trip on the critical path and ~100KB saved. The preconnects to
         fonts.googleapis.com and fonts.gstatic.com went with it - a preconnect to a host
         nothing requests is a wasted DNS lookup and TLS handshake. -->
    <link rel="stylesheet" href="/dashboard/css/tokens.css?v=8.0">
    <link rel="stylesheet" href="/dashboard/css/styles.css?v=8.0">

    <script>
        /* Applied before first paint so a pinned light theme never flashes dark.
           Kept inline and tiny on purpose; the rest of the app is in modules. */
        (function () {
            try {
                var theme = localStorage.getItem('dashboard_theme');
                if (theme === 'dark' || theme === 'light') {
                    document.documentElement.setAttribute('data-theme', theme);
                }
                var lang = localStorage.getItem('dashboard_lang');
                if (lang !== 'ar' && lang !== 'en') {
                    /* First visit: take the language from the browser rather
                       than hardcoding one. I18N.init() reads the same key. */
                    var prefs = navigator.languages || [navigator.language || ''];
                    for (var i = 0; i < prefs.length; i++) {
                        var tag = String(prefs[i] || '').toLowerCase();
                        if (tag.indexOf('ar') === 0) { lang = 'ar'; break; }
                        if (tag.indexOf('en') === 0) { lang = 'en'; break; }
                    }
                    if (lang === 'ar' || lang === 'en') localStorage.setItem('dashboard_lang', lang);
                }
                if (lang === 'en') {
                    document.documentElement.lang = 'en';
                    document.documentElement.dir = 'ltr';
                }
            } catch (e) { /* private mode: defaults are fine */ }

            /* Page modules are loaded on demand (see App.loadPageModule), which
               takes nine of the ten off the first visit entirely. The one the
               URL asks for is still needed immediately, so start fetching it
               here — during head parsing, in parallel with everything else —
               instead of after app.js has booted.

               The hash is attacker-controllable, so it is matched against the
               known page list rather than interpolated into a path. */
            try {
                var PAGES = ['overview', 'campaigns', 'posts', 'studio', 'inbox', 'ai_settings',
                             'analytics', 'growth', 'activity', 'settings', 'help', 'operations', 'tenants',
                             'tenant_detail', 'users', 'jobs', 'audit', 'erasure'];
                /* The page is the first segment: #/help/worker#security is "help". */
                var want = (location.hash || '').replace(/^#\/?/, '').split(/[\/?#]/)[0];
                var page = PAGES.indexOf(want) === -1 ? 'overview' : want;
                var preload = function (href) {
                    var link = document.createElement('link');
                    link.rel = 'preload';
                    link.as = 'script';
                    link.href = href;
                    document.head.appendChild(link);
                };
                preload('/dashboard/js/pages/' + page + '.js?v=8.0');
                /* The articles live in their own file, which the help page
                   loads before it paints: fetch both at once. */
                if (page === 'help') preload('/dashboard/js/help-content.js?v=8.0');
            } catch (e) { /* the module still loads, just a beat later */ }
        }());
    </script>
</head>
<body>

    <button type="button" class="skip-link" data-action="app:skipToContent" data-i18n="app.skipToContent">تخطَّ إلى المحتوى</button>

    <!-- ─── Login ────────────────────────────────────────────────────────── -->
    <div id="login-screen" class="login-screen">
        <div class="login-glow" aria-hidden="true"></div>
        <div class="login-container">
            <div class="login-card surface">
                <div class="login-logo">
                    <div class="login-mark"><i data-lucide="zap" aria-hidden="true"></i></div>
                    <h1 class="login-title" data-i18n="login.title">أوتوريبلاي برو</h1>
                    <p class="login-subtitle" data-i18n="login.subtitle">لوحة تحكم أتمتة الرسائل</p>
                </div>
                <form id="login-form" class="login-form">
                    <!-- Optional. Hidden by default so the shared-password path —
                         still the operator's only way in — stays a one-field form. -->
                    <div id="login-email-group" class="form-group hidden">
                        <label class="form-label" for="login-email" data-i18n="login.email">البريد الإلكتروني</label>
                        <div class="input-affix">
                            <i data-lucide="mail" aria-hidden="true"></i>
                            <input class="field" type="email" id="login-email" autocomplete="username"
                                   data-i18n-attr="placeholder:login.emailPlaceholder" placeholder="you@example.com">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="login-password" data-i18n="login.password">كلمة مرور اللوحة</label>
                        <div class="input-affix">
                            <i data-lucide="lock" aria-hidden="true"></i>
                            <input class="field" type="password" id="login-password" autocomplete="current-password" required
                                   data-i18n-attr="placeholder:login.passwordPlaceholder" placeholder="أدخل كلمة المرور">
                        </div>
                    </div>
                    <button type="submit" id="login-btn" class="btn btn-primary btn-full">
                        <span data-i18n="login.submit">تسجيل الدخول</span>
                    </button>
                    <p id="login-error" class="login-error hidden" role="alert"></p>
                    <button type="button" id="login-email-toggle" class="login-alt-link"
                            data-action="app:revealEmailField" data-i18n="login.useAccount">الدخول بحساب بريد إلكتروني</button>
                </form>
            </div>
        </div>
    </div>

    <!-- ─── App ──────────────────────────────────────────────────────────── -->
    <div id="app" class="app hidden">

        <nav id="sidebar" class="sidebar" data-i18n-attr="aria-label:app.mainNav" aria-label="التنقل الرئيسي">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <div class="logo-mark"><i data-lucide="zap" aria-hidden="true"></i></div>
                    <span class="sidebar-brand" data-i18n="app.name">أوتوريبلاي برو</span>
                </div>
            </div>

            <div class="sidebar-nav" id="sidebar-nav">
                <!-- The active marker is one element that MOVES between items
                     rather than a border that appears on whichever item is
                     current. Positioned by App.moveNavIndicator() with a
                     translateY only, so it is direction-agnostic; under a view
                     transition the browser morphs it by its own name. -->
                <span class="nav-indicator" id="nav-indicator" aria-hidden="true"></span>

                <a href="#/overview" class="nav-item active" data-page="overview">
                    <i data-lucide="layout-dashboard" aria-hidden="true"></i>
                    <span data-i18n="nav.overview">نظرة عامة</span>
                </a>
                <a href="#/campaigns" class="nav-item" data-page="campaigns">
                    <i data-lucide="megaphone" aria-hidden="true"></i>
                    <span data-i18n="nav.campaigns">الحملات</span>
                </a>
                <a href="#/posts" class="nav-item" data-page="posts">
                    <i data-lucide="calendar-days" aria-hidden="true"></i>
                    <span data-i18n="nav.posts">جدولة المنشورات</span>
                </a>
                <a href="#/studio" class="nav-item" data-page="studio">
                    <i data-lucide="layers" aria-hidden="true"></i>
                    <span data-i18n="nav.studio">الاستوديو</span>
                </a>
                <a href="#/inbox" class="nav-item" data-page="inbox">
                    <i data-lucide="message-square" aria-hidden="true"></i>
                    <span data-i18n="nav.inbox">صندوق الرسائل</span>
                </a>
                <a href="#/ai_settings" class="nav-item" data-page="ai_settings">
                    <i data-lucide="bot" aria-hidden="true"></i>
                    <span data-i18n="nav.ai_settings">إعدادات الذكاء الاصطناعي</span>
                </a>
                <a href="#/analytics" class="nav-item" data-page="analytics">
                    <i data-lucide="bar-chart-3" aria-hidden="true"></i>
                    <span data-i18n="nav.analytics">التحليلات</span>
                </a>
                <!-- Beside Analytics on purpose: that is how the automation performs,
                     this is how the content performs (Meta insights), plus the SEO
                     tools and the AI coach. -->
                <a href="#/growth" class="nav-item" data-page="growth">
                    <i data-lucide="trending-up" aria-hidden="true"></i>
                    <span data-i18n="nav.growth">النمو والتسويق</span>
                </a>
                <a href="#/activity" class="nav-item" data-page="activity">
                    <i data-lucide="scroll-text" aria-hidden="true"></i>
                    <span data-i18n="nav.activity">سجل النشاط</span>
                </a>
                <a href="#/settings" class="nav-item" data-page="settings">
                    <i data-lucide="settings" aria-hidden="true"></i>
                    <span data-i18n="nav.settings">الإعدادات</span>
                </a>
                <!-- Last in the operator's own list, before the admin group: the
                     Help Center is for every role, and its articles deep-link as
                     #/help/<slug>#<section>. -->
                <a href="#/help" class="nav-item" data-page="help">
                    <i data-lucide="circle-help" aria-hidden="true"></i>
                    <span data-i18n="nav.help">المساعدة</span>
                </a>

                <!-- Platform administration. Revealed by App.applyChrome() only when
                     /auth/me reports role === 'platform_admin'; every one of these
                     routes 404s for anyone else, so the links are not there rather
                     than being there and failing.

                     Order is the order you reach for them: Operations answers "is
                     the platform healthy" and is the morning screen; Erasure is
                     last because it is the only hard delete in the product. -->
                <span class="nav-group-label hidden" data-admin-only data-i18n="nav.group.admin">الإدارة</span>
                <a href="#/operations" class="nav-item hidden" data-page="operations" data-admin-only>
                    <i data-lucide="activity" aria-hidden="true"></i>
                    <span data-i18n="nav.operations">التشغيل</span>
                </a>
                <a href="#/tenants" class="nav-item hidden" data-page="tenants" data-admin-only>
                    <i data-lucide="building-2" aria-hidden="true"></i>
                    <span data-i18n="nav.tenants">الحسابات</span>
                </a>
                <a href="#/users" class="nav-item hidden" data-page="users" data-admin-only>
                    <i data-lucide="users" aria-hidden="true"></i>
                    <span data-i18n="nav.users">المستخدمون</span>
                </a>
                <a href="#/jobs" class="nav-item hidden" data-page="jobs" data-admin-only>
                    <i data-lucide="list-checks" aria-hidden="true"></i>
                    <span data-i18n="nav.jobs">طابور المهام</span>
                </a>
                <a href="#/audit" class="nav-item hidden" data-page="audit" data-admin-only>
                    <i data-lucide="file-clock" aria-hidden="true"></i>
                    <span data-i18n="nav.audit">سجل التدقيق</span>
                </a>
                <a href="#/erasure" class="nav-item hidden" data-page="erasure" data-admin-only>
                    <i data-lucide="user-x" aria-hidden="true"></i>
                    <span data-i18n="nav.erasure">حذف بيانات شخص</span>
                </a>
            </div>

            <div class="sidebar-footer">
                <!-- Your own password. Hidden for the shared-password path, which
                     has no user identity for POST /api/auth/password to change.
                     It lives here, not on the admin-only Users page, because an
                     ORDINARY user is exactly who needs it. -->
                <button id="password-btn" type="button" class="nav-item hidden" data-user-only
                        data-action="app:showPasswordModal">
                    <i data-lucide="key-round" aria-hidden="true"></i>
                    <span data-i18n="password.change">تغيير كلمة المرور</span>
                </button>
                <button id="logout-btn" type="button" class="nav-item nav-logout">
                    <i data-lucide="log-out" aria-hidden="true"></i>
                    <span data-i18n="app.logout">تسجيل الخروج</span>
                </button>
            </div>
        </nav>

        <main id="main-content" class="main-content">

            <header class="page-header">
                <div class="header-start">
                    <button id="mobile-menu-btn" type="button" class="icon-button menu-button"
                            data-i18n-attr="aria-label:app.menu" aria-label="قائمة التنقل"
                            aria-controls="sidebar" aria-expanded="false">
                        <i data-lucide="menu" aria-hidden="true"></i>
                    </button>
                    <div>
                        <h1 id="page-title" class="page-title" data-i18n="nav.overview" lang="ar">نظرة عامة</h1>
                        <p id="page-subtitle" class="page-subtitle"></p>
                    </div>
                </div>
                <div class="header-end">
                    <!-- The in-tenant role, rendered by App.renderRoleBadge() and shown
                         ONLY when it restricts you. An owner sees nothing here: a badge
                         that is always present says nothing, while one that appears
                         exactly when a button is about to refuse is the explanation. -->
                    <div id="tenant-role" class="tenant-role hidden"></div>

                    <!-- Tenant switcher. Rendered by App.renderTenantSwitcher(), and
                         hidden entirely unless this account can reach 2+ tenants. -->
                    <div id="tenant-switcher" class="chip-select hidden"></div>

                    <!-- Language. Labelled with the language you GET, written in
                         its own script, with lang= so the right Plex member shapes it
                         correctly. The markup carries the Arabic-default state
                         (interface ar → the button offers en) so the control
                         has a name and a label before any script runs;
                         App.renderLanguageToggle() re-points it for English. -->
                    <button type="button" id="lang-toggle" class="lang-toggle"
                            lang="en" dir="ltr" aria-label="التبديل إلى الإنجليزية"
                            data-action="app:toggleLanguage">English</button>
                </div>
            </header>

            <!-- Mounted by App.navigate, above the page's own content and
                 outside the container the page replaces. It is how the health
                 strip reaches a screen whose module knows nothing about it,
                 and it is `hidden` on every page that does not ask for it. -->
            <div id="page-prelude" class="page-prelude hidden"></div>

            <div id="page-container" class="page-container" tabindex="-1">
                <!-- Pages are injected here -->
            </div>
        </main>
    </div>

    <!-- role/aria-live live HERE, not on the toast: a live region must exist in the
         accessibility tree before its contents change. Populating a detached node and then
         appending it is the pattern screen readers silently drop. -->
    <div id="toast-container" class="toast-container" role="status" aria-live="polite" aria-atomic="false"></div>

    <div id="modal-overlay" class="modal-overlay hidden">
        <div id="modal-content" class="modal-content" role="dialog" aria-modal="true" tabindex="-1">
            <!-- Modal content injected dynamically -->
        </div>
    </div>

    <!-- Lucide Icons — pinned + SRI. Was unpkg lucide@latest, which now resolves
         to 1.x, where the Instagram and Facebook brand icons no longer exist.
         `defer` because it is 398KB of UMD that used to block HTML parsing in
         <head>; UI.icons() already tolerates its absence, and CSS reserves the
         box for every `i[data-lucide]` so nothing shifts when it lands. It is
         first among the deferred scripts, so it has run by the time app.js
         boots on DOMContentLoaded. -->
    <script defer src="https://cdn.jsdelivr.net/npm/lucide@0.577.0/dist/umd/lucide.min.js"
            integrity="sha384-orgVf2eX2+m1zKAOIi09hD0W6GtVhoOUmqDK+sysYB2JTZ4vS86j4jm+X7a4Nnei"
            crossorigin="anonymous"></script>

    <!-- Chart.js is gone entirely, not merely deferred. It was ~201KB of UMD from
         a CDN for four charts, it looked generic because it WAS generic, and a
         canvas render cannot be tested. dashboard/js/charts.js now builds SVG from
         pure functions. Note this does NOT let cdn.jsdelivr.net leave the CSP:
         Lucide still loads from there. -->

    <script defer src="/dashboard/js/i18n.js?v=8.0"></script>
    <script defer src="/dashboard/js/api.js?v=8.0"></script>
    <script defer src="/dashboard/js/components.js?v=8.0"></script>
    <script defer src="/dashboard/js/motion.js?v=8.0"></script>
    <script defer src="/dashboard/js/charts.js?v=8.0"></script>
    <!-- Not a page: the administration foundation (Admin.confirm, which replaces
         window.confirm for destructive actions anywhere) plus the health strip,
         which has to be available on a page whose own module does not know
         about it. Small, and needed off the admin screens, so it is eager. -->
    <script defer src="/dashboard/js/pages/admin_common.js?v=8.0"></script>
    <script defer src="/dashboard/js/app.js?v=8.0"></script>

</body>
</html>
